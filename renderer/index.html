<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotaB Launcher</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <div id="app" class="app-container">
    <div class="palette-card">
      <!-- Search Bar -->
      <div class="search-wrapper">
        <div class="search-icon">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </div>

        <div id="modeBadge" class="mode-badge hidden">
          <span id="modeBadgeIcon">🎬</span>
          <span id="modeBadgeText">Film</span>
        </div>

        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Ara... (10 usd, f: film, w: wiki, iftar, 25*4)"
          autocomplete="off"
          spellcheck="false"
        />

        <button id="clearBtn" class="clear-btn hidden" title="Temizle">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <div class="search-hints">
          <span class="hint-tag"><kbd>Alt</kbd>+<kbd>Space</kbd></span>
        </div>
      </div>

      <!-- Results Area -->
      <div id="results" class="results-container hidden">
        <!-- Results injected here -->
      </div>

      <!-- Footer hints -->
      <div id="footer" class="footer hidden">
        <div class="footer-brand">
          <span class="brand-dot"></span>
          <span class="brand-text">NotaB</span>
        </div>
        <div class="footer-actions">
          <span class="footer-hint"><kbd>↵</kbd> seç</span>
          <span class="footer-hint"><kbd>↑↓</kbd> gezin</span>
          <span class="footer-hint"><kbd>Esc</kbd> kapat</span>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast hidden">
      <span class="toast-icon">✓</span>
      <span id="toastMsg" class="toast-msg">Kopyalandı</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
